name: NGINX
on:
  push:
    branches: [ master ]
    paths:
      - 'nginx/**'
  workflow_dispatch:

env:
  HUB_USER: gioamato
  REPO_NAME: stateless-wordpress
  IMAGE_TAG: nginx-alpine
  PLATFORMS: linux/amd64,linux/arm64
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    # Set up QEMU and Buildx for multi-arch builds
    - uses: docker/setup-qemu-action@v4.4.0
    - uses: docker/setup-buildx-action@v4.4.1

    # Docker Hub Login
    - uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build multi-arch image and push to Docker Hub
    - uses: docker/build-push-action@v7.4.0
      with:
        context: ./nginx
        platforms: ${{ env.PLATFORMS }}
        push: true
        tags: ${{ env.HUB_USER }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}
