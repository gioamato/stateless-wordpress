name: CI
on:
  # No path filters: ci-ok is a required check, and a skipped required check blocks the merge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: tests/lint.sh

  # Same build and smoke test that release.yml runs before pushing
  smoke:
    uses: ./.github/workflows/build-test.yml

  # Single required check for branch protection, so the jobs above can change without touching it
  ci-ok:
    if: always()
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
