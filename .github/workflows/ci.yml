name: CI
on:
  # No path filters: ci-ok is a required check, and a skipped required check blocks the merge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: tests/lint.sh

  # Build both images natively on each architecture and test them together
  smoke:
    name: smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4.4.1

    - uses: docker/build-push-action@v7.4.0
      with:
        context: ./wordpress
        load: true
        tags: stateless-wordpress:wordpress-test
        cache-from: type=gha,scope=wordpress-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=wordpress-${{ matrix.arch }}

    - uses: docker/build-push-action@v7.4.0
      with:
        context: ./nginx
        load: true
        tags: stateless-wordpress:nginx-test
        cache-from: type=gha,scope=nginx-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=nginx-${{ matrix.arch }}

    - run: tests/smoke.sh
      env:
        SMOKE_NO_BUILD: "1"

  # Single required check for branch protection, so the jobs above can change without touching it
  ci-ok:
    if: always()
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
