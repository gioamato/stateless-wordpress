version: '3.7'

volumes:
  db-data:
  # Stateful mode: WordPress is copied in on first boot and then installs/updates plugins, themes and itself
  # here. For a stateless deployment set WORDPRESS_STATELESS=1 and offload media (see "Environments")
  wp-data:

services:
  db:
    container_name: stateless-wordpress_db
    image: mysql:8.4
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

  wordpress:
    container_name: stateless-wordpress_wordpress
    build: ./wordpress
    restart: always
    volumes:
      - wp-data:/var/www/html
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress

  nginx:
    container_name: stateless-wordpress_nginx
    build: ./nginx
    restart: always
    volumes:
      - wp-data:/var/www/html
    depends_on: 
      - wordpress
    ports: 
      - "8080:80"
    environment:
      UPSTREAM_SERVER: wordpress
      # Behind a reverse proxy (e.g. NGINX Proxy Manager), trust its address(es) to get real client IPs:
      # REAL_IP_FROM: 172.18.0.0/16
