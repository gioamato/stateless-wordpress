volumes:
  db-data:
  # WordPress code (synced from the image on every start) and the FastCGI cache, shared by NGINX and PHP-FPM.
  # In memory and never persisted, like the Kubernetes emptyDir: there is no data in it, since media are
  # offloaded to object storage (see "Data and persistence" in the README)
  wp-code:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g

services:
  db:
    image: mysql:8.4
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

  wordpress:
    build: ./wordpress
    restart: always
    # Stateless PHP-FPM replicas behind one NGINX, which balances requests across them
    deploy:
      replicas: ${WORDPRESS_REPLICAS:-2}
    volumes:
      # nocopy: the entrypoint fills the volume itself, and Docker copying the image's /var/www/html into
      # it would race between replicas created at the same time ("mkdir .../wp-content: file exists")
      - type: volume
        source: wp-code
        target: /var/www/html
        volume:
          nocopy: true
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress

  nginx:
    build: ./nginx
    restart: always
    volumes:
      - type: volume
        source: wp-code
        target: /var/www/html
        volume:
          nocopy: true
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    environment:
      UPSTREAM_SERVER: wordpress
      # Behind a reverse proxy (e.g. NGINX Proxy Manager), trust its address(es) to get real client IPs:
      # REAL_IP_FROM: 172.18.0.0/16
