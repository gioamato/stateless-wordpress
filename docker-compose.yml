volumes:
  db-data:
  # WordPress code (synced from the image on every start) and the FastCGI cache, shared by NGINX and PHP-FPM.
  # In memory and never persisted, like the Kubernetes emptyDir: there is no data in it, since media are
  # offloaded to object storage (see "Data and persistence" in the README)
  wp-code:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g

services:
  db:
    image: mysql:8.4
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

  wordpress:
    build: ./wordpress
    restart: always
    # Stateless PHP-FPM replicas behind one NGINX, which balances requests across them
    deploy:
      replicas: ${WORDPRESS_REPLICAS:-2}
    volumes:
      - wp-code:/var/www/html
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress

  nginx:
    build: ./nginx
    restart: always
    volumes:
      - wp-code:/var/www/html
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    environment:
      UPSTREAM_SERVER: wordpress
