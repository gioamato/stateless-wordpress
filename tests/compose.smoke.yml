# Overrides docker-compose.yml for tests/smoke.sh:
# - drops the fixed container names and binds a separate port, so it can run next to a dev stack
# - waits for MySQL to be healthy before starting WordPress
# - sets non-default PHP/FPM values, so the test can prove env vars reach php.ini and the FPM pool
# - reads the DB password from a *_FILE secret and the DB user from a deprecated WP_* variable (web side),
#   and passes media offloading settings as plain and *_FILE variables (wp-cli side)
# - adds a wp-cli service to inspect the installed site
services:
  db:
    container_name: !reset null
    restart: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 90

  wordpress:
    container_name: !reset null
    image: ${WORDPRESS_IMAGE:-stateless-wordpress:wordpress-test}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    secrets: [ db-password ]
    environment:
      PHP_MEMORY_LIMIT: 192M
      PHP_FPM_MAX_CHILDREN: "7"
      WORDPRESS_DB_PASSWORD: !reset null
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db-password
      WORDPRESS_DB_USER: !reset null
      WP_DB_USER: wordpress

  nginx:
    container_name: !reset null
    image: ${NGINX_IMAGE:-stateless-wordpress:nginx-test}
    restart: "no"
    ports: !override
      - "127.0.0.1:${SMOKE_PORT:-8089}:80"

  cli:
    image: wordpress:cli-2.12.0
    profiles: [cli]
    # www-data on the Alpine-based images, so wp-cli can read the shared volume
    user: "82:82"
    volumes:
      - wp-data:/var/www/html
    depends_on:
      - db
    secrets: [ gcs-bucket ]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      MICROSOFT_AZURE_CONTAINER: smoke-container
      WP_STATELESS_MEDIA_BUCKET_FILE: /run/secrets/gcs-bucket

secrets:
  db-password:
    file: ./tests/secrets/db-password
  gcs-bucket:
    file: ./tests/secrets/gcs-bucket
